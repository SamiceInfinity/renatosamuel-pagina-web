<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melhores jogos indies</title>
    <style>
        header {
            background-color: #d12f2f;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #631818;
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        article{
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Melhores Jogos Indies</h1>
        <p>ULTRAKILL</p>
    </header>
    <main>
        <article>
            <img src="FODA 2.jpg
                alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">
            <div>
                <h2>1. Ultrakill</h2>
                <p class="artigo-autor"></p>
                <p>UltraKill é um top jogos já criado.</p>
                <button>👍 <span>0</span></button>
                <button>👎 <span>0</span></button>
            </div>
        </article>
        <article>
            <img src="imagem-blog.png"
                alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">
            <div>
                <h2>Meu segundo post</h2>
                <p class="artigo-autor">Por: Renato Lustosa e Samuel Neves</p>
                <p>Pessoal do Games e tecnologia, vão tomar no olho do cu.</p>
                <button>👎 <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false){
                texto.textContent++;
                curtiu = true;
            } else{
                texto.textContent--;
                curtiu = false;
            }
        }
    })


</script>

</html>
